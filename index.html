<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squid Game Landing Page</title>

  <link rel="stylesheet" href="squid.css">
</head>
<body>

  <div class="container">
    <nav>
      <div class="logo">
        <img src="./logo.png" alt="">
      </div>

      <div class="nav-links">
        <a href="#">About</a>
        <a href="#">Watch now</a>
        <a href="#">Actors</a>
        <a href="#">Contact</a>
      </div>

      <div class="menu">☰</div>
    </nav>

    <div class="hero">

      <div class="left">
        <img src="./logo.png" alt="">

        <div class="symbols">
          <span>◯</span>
          <span>△</span>
          <span>□</span>
        </div>

        <div class="description">
          Action / Thriller / Drama Series directed by Dong-hyuk Hwang<br>
          Season 1 • 9 Episodes
        </div>

        <div class="buttons">
          <button class="play-btn">▶ Play Now</button>
          
        </div>
      </div>

      <div class="right">
        <img src="./right.png" alt="Squid Game Guard">
      </div>

    </div>

    
    <div class="cards">

      <div class="card">
        <img src="https://i.pinimg.com/1200x/eb/4f/46/eb4f466d68c5b1f148876774d32545f8.jpg" alt="">
        <div class="play-icon">▶</div>
      </div>

      <div class="card">
        <img src="https://i.pinimg.com/1200x/b9/c1/71/b9c1715a78be7f83dd1d0c076c901e18.jpg" alt="">
        <div class="play-icon">▶</div>
      </div>

      <div class="card">
        <img src="https://i.pinimg.com/736x/98/33/77/983377a4bdad381ae0bc15b262a38578.jpg" alt="">
        <div class="play-icon">▶</div>
      </div>

    </div>

  </div>

</body>
</html>
